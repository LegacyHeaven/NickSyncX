branding:
  display-name: "NickSyncX"

network:
  channel: "nicksync:sync"

storage:
  type: "sqlite"
  sqlite:
    file: "nicknames.sqlite"
  backup:
    automatic: true
    interval-minutes: 60
    file: "backups/nicksyncx.backup"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "nicksync"
    username: "nicksync"
    password: "CHANGE_ME"
    parameters: "useSSL=false&serverTimezone=UTC"

logging:
  debug: false

commands:
  admin-permission: "nicksyncx.admin"
