name: Build NickSyncX

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both plugins
        run: gradle --no-daemon clean build

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: NickSyncX-${{ github.run_number }}
          path: |
            api/build/libs/NickSyncX-API-*.jar
            paper/build/libs/paper-*.jar
            velocity/build/libs/velocity-*.jar
            !velocity/build/libs/*-plain.jar
          if-no-files-found: error

      - name: Prepare release files
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p release
          cp api/build/libs/NickSyncX-API-*.jar release/
          cp paper/build/libs/paper-*.jar release/
          find velocity/build/libs -maxdepth 1 -type f -name 'velocity-*.jar' ! -name '*-plain.jar' -exec cp {} release/ \;
          ls -l release

      - name: Publish build to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: action-build
          name: action-build
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: false