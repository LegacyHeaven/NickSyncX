name: Build NickSyncX

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8'

      - name: Build both plugins
        run: gradle --no-daemon clean build

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: NickSyncX-${{ github.run_number }}
          path: |
            api/build/libs/NickSyncX-API-*.jar
            paper/build/libs/paper-*.jar
            velocity/build/libs/velocity-*.jar
            !velocity/build/libs/*-plain.jar
          if-no-files-found: error