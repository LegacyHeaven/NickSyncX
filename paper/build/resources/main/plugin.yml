name: NickSyncX
version: 1.5.0
main: dev.legacyheaven.nicksync.LegacyNickSyncPlugin
description: Synchronizes nicknames across Paper and Velocity servers.
author: LegacyHeaven
website: https://legacyheaven.dev
api-version: '1.20'
softdepend: [Essentials, CMI, PlaceholderAPI]
commands:
  nicksync:
    description: Synchronize your nickname across the network.
    usage: /nicksync [sync [player]|force|status]
    aliases: [lns]
permissions:
  nicksyncx.sync:
    description: Allows manual nickname synchronization.
    default: op
